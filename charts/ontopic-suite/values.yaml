# Default values for ontopic-studio.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.
global:
  registry: registry.gitlab.com/ontopic/suite/helm
  #registry: registry.gitlab.com/ontopic/ontopic-suite/helm
  imagePullPolicy: IfNotPresent
  kubectl:
    image: docker.io/alpine/k8s
    tag: "1.35.1"

replicaCount: 1

image:
  repository: nginx
  # Overrides the image tag whose default is helm-<chart appVersion>.
  tag: ""

ingress:
  # className: ""
  host: ontopic.local  # Set your domain here (must match services.web.env.virtual_host)
  tls: false
  # secretName: ontopic-studio-tls
  # annotations: {}

imagePullSecrets:
  - name: regcred

nameOverride: ""
fullnameOverride: ""

serviceAccount:
  # Specifies whether a service account should be created
  create: true
  # Automatically mount a ServiceAccount's API credentials?
  automount: true
  # Annotations to add to the service account
  annotations: {}
  # The name of the service account to use.
  # If not set and create is true, a name is generated using the fullname template
  name: ""

podAnnotations: {}
podLabels: {}

podSecurityContext:
  fsGroup: 1000

securityContext: {}
  # capabilities:
  #   drop:
  #   - ALL
  # readOnlyRootFilesystem: true
  # runAsNonRoot: true
  # runAsUser: 1000

persistentVolumeClaimRetentionPolicy:
  ## @param persistentVolumeClaimRetentionPolicy.enabled Enable Persistent volume retention policy for Deployment
  ##
  enabled: false
  ## @param persistentVolumeClaimRetentionPolicy.whenScaled Volume retention behavior when the replica count of the Deployment is reduced
  ##
  whenScaled: Retain
  ## @param persistentVolumeClaimRetentionPolicy.whenDeleted Volume retention behavior that applies when the Deployment is deleted
  ##
  whenDeleted: Retain

resources: {}
  # We usually recommend not to specify default resources and to leave this as a conscious
  # choice for the user. This also increases chances charts run on environments with little
  # resources, such as Minikube. If you do want to specify resources, uncomment the following
  # lines, adjust them as necessary, and remove the curly braces after 'resources:'.
  # limits:
  #   cpu: 100m
  #   memory: 128Mi
  # requests:
  #   cpu: 100m
  #   memory: 128Mi

livenessProbe:
  httpGet:
    path: /
    port: http
readinessProbe:
  httpGet:
    path: /
    port: http

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 100
  targetCPUUtilizationPercentage: 80
  # targetMemoryUtilizationPercentage: 80

# Additional volumes on the output Deployment definition.
volumes: []
# - name: foo
#   secret:
#     secretName: mysecret
#     optional: false

# Additional volumeMounts on the output Deployment definition.
volumeMounts: []
# - name: foo
#   mountPath: "/etc/foo"
#   readOnly: true

nodeSelector: {}

tolerations: []

affinity: {}

services:
  ##--- Angular frontend
  angular-frontend:
    image:
      repository: studio
      # Overrides the image tag whose default is helm-<chart appVersion>.
      tag: ""

    livenessProbe:
      httpGet:
        path: /
        port: 4200

    readinessProbe:
      httpGet:
        path: /
        port: 4200

    envConfigMapName: angular-frontend-config

    env:
      IS_DEMO_VERSION: false
      HIDE_PROJECTS: false
      IS_DESKTOP_VERSION: false

  ##--- Identity service
  identity-service:
    image:
      repository: identity-service
      # Overrides the image tag whose default is helm-<chart appVersion>.
      tag: ""

    args:
      - "--session.enable=true"
      - "--identity.enable=true"

    livenessProbe:
      httpGet:
        path: /health
        port: 8080

    readinessProbe:
      httpGet:
        path: /health
        port: 8080

    envConfigMapName: identity-service-env

    # OIDC Configuration
    # Configure your identity provider here instead of using raw environment variables
    oidc:
      # Provider type: "azure", "okta", "keycloak", or leave empty for password-only auth
      provider: ""

      # Client credentials (used by all OAuth2 providers)
      clientId: ""

      # Session configuration
      session:
        # OIDC scopes to request (e.g., "openid,email,profile,offline_access")
        scope: ""
        # OIDC prompt parameter (e.g., "consent", "login")
        prompt: ""

      # Token validation settings
      audience: ""
      scopes: ""
      roles: ""

      # Custom claims mapping (override default claim names)
      claims:
        email: ""
        group: ""
        role: ""

      # Azure-specific settings (when provider: "azure")
      azure:
        tenantId: ""

      # Okta-specific settings (when provider: "okta")
      okta:
        issuerUrl: ""

      # Keycloak-specific settings (when provider: "keycloak")
      keycloak:
        host: ""
        realm: ""
        adminApplication: ""
        adminUser: ""

    env:
      ONTOPIC_IDENTITY_SERVICE_DEBUG: false
      ONTOPIC_IDENTITY_SERVICE_TIMEOUT_IDLE:
      ONTOPIC_IDENTITY_SERVICE_TIMEOUT_READ:
      ONTOPIC_IDENTITY_SERVICE_TIMEOUT_WRITE:
      ONTOPIC_IDENTITY_SERVICE_SESSION_STORE_FILE: /etc/identity-service/data/session.db
      ONTOPIC_IDENTITY_SERVICE_COOKIE_PREFIX: _ontopic-suite
      ONTOPIC_IDENTITY_SERVICE_COOKIE_SECRET_FILE: /run/secrets/cookie-secret/cookie-secret
      # Automatically set to true when ingress.tls is enabled
      ONTOPIC_IDENTITY_SERVICE_COOKIE_SECURE: false
      ONTOPIC_IDENTITY_SERVICE_COOKIE_HTTPONLY: true
      ONTOPIC_IDENTITY_SERVICE_COOKIE_SAME_SITE: lax
      ONTOPIC_IDENTITY_SERVICE_COOKIE_EXPIRATION:
      ONTOPIC_IDENTITY_SERVICE_COOKIE_REFRESH:
      ONTOPIC_IDENTITY_SERVICE_CUSTOM_TEMPLATE_DIR: /etc/identity-service/templates
      ONTOPIC_IDENTITY_SERVICE_IDENTITY_REFRESH:

    secrets:
      cookie-secret: /run/secrets/cookie-secret

    # Conditional secrets - mounted based on a values condition (for secrets created by jobs)
    # The envVars are only added to the ConfigMap when the condition is true
    conditionalSecrets:
      # Password file for local user authentication (created by users job when users.enabled=true)
      password-file-db:
        mountPath: /run/secrets/password-file-db
        condition: users.enabled
        envVars:
          ONTOPIC_IDENTITY_SERVICE_PASSWORD_FILE: /run/secrets/password-file-db/password-file-db
          ONTOPIC_IDENTITY_SERVICE_PROVIDER_PASSWORD: password-file

    # Optional secrets - only mounted if the Kubernetes secret exists (uses lookup)
    # The envVars are only added to the ConfigMap when the secret is detected
    optionalSecrets:
      # Client secret for OAuth2 providers (Azure, Okta, Keycloak)
      client-secret:
        mountPath: /run/secrets/client-secret
        envVars:
          ONTOPIC_IDENTITY_SERVICE_CLIENT_SECRET_FILE: /run/secrets/client-secret/client-secret
          ONTOPIC_IDENTITY_SERVICE_AZURE_API_CLIENT_SECRET_FILE: /run/secrets/client-secret/client-secret

  ##--- Process server
  process-server:
    image:
      repository: process-server
      # Overrides the image tag whose default is helm-<chart appVersion>.
      tag: ""

    livenessProbe:
      httpGet:
        path: /process-api/healthcheck
        port: 8666
      initialDelaySeconds: 75
      periodSeconds: 5

    readinessProbe:
      httpGet:
        path: /process-api/healthcheck
        port: 8666
      initialDelaySeconds: 75
      periodSeconds: 5

    envConfigMapName: process-server-config

    env:
      STORE_SERVICE_HOST: localhost
      STORE_SERVICE_PORT: 3000
      LICENSE_TYPE: ontopic
      USER_LICENSE_FILE: /run/secrets/user-license/user-license
      JDBC_ROOT_DIR: /app/jdbc

    secrets:
      user-license-file: /run/secrets/user-license

    # Optional secrets - only mounted if the Kubernetes secret exists
    optionalSecrets:
      jdbc-private-key:
        mountPath: /run/secrets/jdbc-private-key
        envVars:
          JDBC_EXTERNAL_REPO_KEY_PATH: /run/secrets/jdbc-private-key/jdbc-private-key

  ##--- Store server
  store-server:
    image:
      repository: store-server
      # Overrides the image tag whose default is helm-<chart appVersion>.
      tag: ""

    livenessProbe:
      httpGet:
        path: /internal-store-api/healthcheck
        port: 3000

    readinessProbe:
      httpGet:
        path: /internal-store-api/healthcheck
        port: 3000

    init:
      - name: init-permissions
        image: alpine
        command: ["sh", "-c", "chown 1000:1000 /app/docs && chown 1000:1000 /app/repos"]
        volumeMounts:
          - mountPath: /app/docs
            name: docs-dir
          - mountPath: /app/repos
            name: repos-dir

    envConfigMapName: store-server-config

    env:
      NODE_ENV: production
      DB_RESET: "false"
      DB_MIGRATE: "true"
      DB_SEED: "false"
      DATABASE_PASSWORD_FILE: /run/secrets/database-password/database-password
      CASBIN_STORE_PASSWORD_FILE: /run/secrets/database-password/database-password
      ONTOPIC_SERVER_HOST: ontopic-server
      ONTOPIC_SERVER_WEB_API_PORT: 8080
      ONTOPIC_SERVER_POSTGRES_PORT: 4300
      IDENTITY_SERVICE_NAME: localhost
      IDENTITY_SERVICE_PORT: 8080
      ONTOPIC_RESTORE_PROJECTS_DB: false
      ONTOPIC_RESTORE_PROJECTS_DB_FILE: docs/backups/backupjson.log.gz
      PROCESS_SERVICE_HOST: localhost
      PROCESS_SERVICE_PORT: 8666
      ENABLE_GIT_REPO: false
      ONTOPIC_SAMPLE_DB: false
      ONTOPIC_SAMPLE_DB_URL: jdbc:postgresql://ontopic-suite-demo-db/postgres
      ONTOPIC_SAMPLE_DB_USERNAME: postgres
      ONTOPIC_SAMPLE_DB_PASSWORD: postgres2
      ONTOPIC_SAMPLE_DB_DRIVER: org.postgresql.Driver
      ONTOPIC_ENABLE_AUTHENTICATION: true
      ENABLE_MATERIALIZATION: false
      ENABLE_SEMANTIC_SQL: true
      DB_CLIENT: pg

    volumes:
      - volumeName: "docs-dir"
        existingClaim: ""
        mountPath: /app/docs
        subPath: ""
        storageClass: ""
        accessModes:
          - ReadWriteOnce
        size: 8Gi
        annotations: {}
        labels: {}
        selector: {}
        dataSource: {}
      - volumeName: "repos-dir"
        existingClaim: ""
        mountPath: /app/repos
        subPath: ""
        storageClass: ""
        accessModes:
          - ReadWriteOnce
        size: 8Gi
        annotations: {}
        labels: {}
        selector: {}
        dataSource: {}

    secrets:
      database-password: /run/secrets/database-password

  ##--- Web
  web:
    image:
      repository: nginx
      # Overrides the image tag whose default is helm-<chart appVersion>.
      tag: ""

    livenessProbe:
      httpGet:
        path: /
        port: 8083

    readinessProbe:
      httpGet:
        path: /
        port: 8083

    service:
      name: web
      type: ClusterIP
      port: 80
      targetPort: 8083

    ingress:
      enabled: true
      className: ""
      annotations: {}
        # kubernetes.io/ingress.class: nginx
        # kubernetes.io/tls-acme: "true"
      hosts:
        - host: ontopic.local
          paths:
            - path: /
              pathType: Prefix
      tls: []

    envConfigMapName: web-config

    env:
      VIRTUAL_PORT: 8083
      ANGULAR_FRONTEND_SERVICE_HOST: localhost
      ANGULAR_FRONTEND_SERVICE_PORT: 4200
      IDENTITY_SERVICE_HOST: localhost
      IDENTITY_SERVICE_PORT: 8080
      PROCESS_SERVER_SERVICE_HOST: localhost
      PROCESS_SERVER_SERVICE_PORT: 8666
      STORE_SERVER_SERVICE_HOST: localhost
      STORE_SERVER_API_SERVICE_PORT: 3000
      STORE_SERVER_DOC_SERVICE_PORT: 3001
      ONTOPIC_SERVER_SERVICE_HOST: ontopic-server
      ONTOPIC_SERVER_SERVICE_PORT: 8080
      # GIT_MIRROR_SERVICE_HOST: localhost
      # GIT_MIRROR_SERVICE_PORT: 80

# Create users
users:
  # -- enable the user creation job
  enabled: true
  # -- list of users to create
  list:
    - username: test
      password: "test"
      email: test@email.it
      fullname: Test
      groups: []
      roles:
        - ots-admin

# Configure the PostgreSQL subchart
db:
  # -- deploy the PostgreSQL database in the cluster using the Bitnami PostgreSQL chart
  # -- or connect to an external database 
  deployedInCluster: true
  # -- database host 
  host: store-server-db-postgresql
  # -- database port
  port: 5432
  # -- database name
  name: internal
  # -- database user
  user: postgres
  # -- fullnameOverride is used to override the name of the subchart
  fullnameOverride: "store-server-db-postgresql"
  image:
    tag: "17"

# Include demo database
demoData:
  enabled: false

# Configure Let's Encrypt ClusterIssuer for cert-manager
clusterIssuer:
  # -- enable creation of the ClusterIssuer
  enabled: false
  # -- name of the ClusterIssuer
  name: letsencrypt-prod
  # -- ACME server URL (use https://acme-staging-v02.api.letsencrypt.org/directory for staging)
  server: https://acme-v02.api.letsencrypt.org/directory
  # -- email address for ACME registration
  email: ""
  # -- name of the secret to store the private key
  privateKeySecretRef: letsencrypt-prod
  # -- ingress class for HTTP01 solver
  ingressClass: ""

# Configure the Ontopic Server subchart
ontopic-server:
  # -- enable the Ontopic Server chart
  enabled: true
  # -- fullnameOverride is used to override the name of the subchart
  fullnameOverride: "ontopic-server"
