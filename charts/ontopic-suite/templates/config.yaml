{{- range $name, $values := .Values.services }}
{{- with $values }}
---
apiVersion: v1
kind: ConfigMap
metadata:
    name: {{.envConfigMapName}}
data:
{{- $env := .env }}
{{- if and (hasKey $.Values $name) (hasKey (get $.Values $name) "env") }}
{{- $env = merge (get $.Values $name).env .env }}
{{- end }}
{{- /* For identity-service: generate env vars from structured OIDC config */ -}}
{{- if eq $name "identity-service" }}
{{- $oidcConfig := .oidc }}
{{- if and (hasKey $.Values "identity-service") (hasKey (get $.Values "identity-service") "oidc") }}
{{- $oidcConfig = mergeOverwrite (deepCopy .oidc) (get $.Values "identity-service").oidc }}
{{- end }}
{{- $oidcEnv := include "ontopic-suite.identity-service-oidc-env" $oidcConfig | fromJson }}
{{- $env = merge $env $oidcEnv }}
{{- end }}
{{- /* Merge env vars from conditionalSecrets based on condition */ -}}
{{- if .conditionalSecrets }}
{{- range $secretName, $config := .conditionalSecrets }}
{{- $conditionPath := splitList "." $config.condition }}
{{- $conditionValue := $.Values }}
{{- range $conditionPath }}
{{- $conditionValue = index $conditionValue . }}
{{- end }}
{{- if and $config.envVars $conditionValue }}
{{- $env = merge $config.envVars $env }}
{{- end }}
{{- end }}
{{- end }}
{{- /* Merge env vars from optionalSecrets only if the secret exists */ -}}
{{- if .optionalSecrets }}
{{- range $secretName, $config := .optionalSecrets }}
{{- if and $config.envVars (lookup "v1" "Secret" $.Release.Namespace $secretName) }}
{{- $env = merge $config.envVars $env }}
{{- end }}
{{- end }}
{{- end }}
{{- /* Auto-enable secure cookies for identity-service when TLS is enabled */ -}}
{{- if and (eq $name "identity-service") $.Values.ingress.tls }}
{{- $_ := set $env "ONTOPIC_IDENTITY_SERVICE_COOKIE_SECURE" true }}
{{- end }}
{{- /* Auto-enable sample DB for store-server when demo data is enabled */ -}}
{{- if and (eq $name "store-server") $.Values.postgresql.enableDemoData }}
{{- $_ := set $env "ONTOPIC_SAMPLE_DB" "true" }}
{{- end }}
{{- /* Set ENABLE_MATERIALIZATION for store-server based on ontopic-server.enableMaterialization */ -}}
{{- if and (eq $name "store-server") (index $.Values "ontopic-server").enableMaterialization }}
{{- $_ := set $env "ENABLE_MATERIALIZATION" "true" }}
{{- end }}
{{- include "ontopic-suite.env" $env }}
{{- end }}
{{- end }}
