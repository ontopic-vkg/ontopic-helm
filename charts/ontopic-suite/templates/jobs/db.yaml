{{- if and (.Values.db.deployedInCluster) (.Values.db.enableSecretCreation) }}
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ .Release.Name }}-update-db-secrets
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["create","get","delete","patch", "update"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get"]
  - apiGroups: [""]
    resources: ["pods/exec"]
    verbs: ["create"]
  - apiGroups: [""]
    resources: ["services"]
    verbs: ["create", "get", "patch", "update", "delete"]
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["create", "get", "patch", "update", "delete"]
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Release.Name }}-update-db-secrets
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ .Release.Name }}-update-db-secrets
subjects:
  - kind: ServiceAccount
    namespace: {{ .Release.Namespace }}
    name: {{ .Release.Name }}-update-db-secrets
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ .Release.Name }}-update-db-secrets
---
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ .Release.Name }}-update-db-secrets
  labels:
    app.kubernetes.io/managed-by: {{ .Release.Service | quote }}
    app.kubernetes.io/instance: {{ .Release.Name | quote }}
    app.kubernetes.io/version: {{ .Chart.AppVersion }}
    helm.sh/chart: "{{ .Chart.Name }}-{{ .Chart.Version }}"
  annotations:
    helm.sh/hook: post-install,post-upgrade
    helm.sh/hook-weight: "1"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  template:
    metadata:
      labels:
        app.kubernetes.io/managed-by: {{ .Release.Service | quote }}
        app.kubernetes.io/instance: {{ .Release.Name | quote }}
        helm.sh/chart: "{{ .Chart.Name }}-{{ .Chart.Version }}"
    spec:
      serviceAccountName: {{ .Release.Name }}-update-db-secrets
      restartPolicy: Never
      containers:
      - name: create-secret
        image: bitnami/kubectl:latest
        command:
        - "sh"
        - "-c"
        - |
            set -e
            if kubectl get secret database-password-file >/dev/null 2>&1; then
              echo "Secret 'database-password-file' already exists, skipping creation."
              exit 0
            fi
            sleep 10
            kubectl create secret generic database-password-file \
              --from-literal=database-password-file="$(kubectl get secret store-server-db-postgresql -o jsonpath="{.data.postgres-password}" | base64 -d)" \
              --dry-run=client -o yaml | kubectl apply -f -
      {{- if .Values.db.enableDatabaseCreation }}
      - name: create-database
        image: bitnami/kubectl:latest
        command:
        - "sh"
        - "-c"
        - |
            set -e
            echo "Waiting for database-password-file secret..."
            until kubectl get secret database-password-file >/dev/null 2>&1; do
              echo "Secret not ready yet, waiting..."
              sleep 2
            done
            POSTGRES_PASSWORD=$(kubectl get secret database-password-file -o jsonpath="{.data.database-password-file}" | base64 -d)
            echo "Secret is ready!"

            echo "Waiting for PostgreSQL to be ready..."
            until kubectl exec store-server-db-postgresql-0 -- /opt/bitnami/scripts/postgresql/entrypoint.sh /bin/bash -c 'pg_isready -U postgres' 2>/dev/null; do
              echo "PostgreSQL is not ready yet, waiting..."
              sleep 2
            done
            echo "PostgreSQL is ready!"

            # In case of reboot
            sleep 20

            # Check if database already exists
            DB_EXISTS=$(echo "SELECT 1 FROM pg_database WHERE datname = 'internal';" | kubectl exec -i store-server-db-postgresql-0 -- /opt/bitnami/scripts/postgresql/entrypoint.sh /bin/bash -c "PGPASSWORD=$POSTGRES_PASSWORD psql -t" | xargs)
            if [ "$DB_EXISTS" = "1" ]; then
              echo "Database 'internal' already exists, skipping creation."
              exit 0
            fi

            # Create database
            echo "Create database"
            echo "create database internal;" | kubectl exec -i store-server-db-postgresql-0 -- /opt/bitnami/scripts/postgresql/entrypoint.sh /bin/bash -c "PGPASSWORD=$POSTGRES_PASSWORD psql"

            # Grant privileges to the database
            echo "Grant privileges to the database"
            echo "grant all privileges on database internal to postgres;" | kubectl exec -i store-server-db-postgresql-0 -- /opt/bitnami/scripts/postgresql/entrypoint.sh /bin/bash -c "PGPASSWORD=$POSTGRES_PASSWORD psql"
            echo "alter database internal OWNER TO postgres;" | kubectl exec -i store-server-db-postgresql-0 -- /opt/bitnami/scripts/postgresql/entrypoint.sh /bin/bash -c "PGPASSWORD=$POSTGRES_PASSWORD psql"
      {{- end }}
{{- end }}
