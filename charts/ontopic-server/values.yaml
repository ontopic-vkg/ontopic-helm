# Default values for ontopic-server.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.
# registry: ghcr.io/ontopic-vkg/ontopic-helm
registry: ghcr.io/ontopic-vkg/ontopic-helm
replicaCount: 1

image:
  repository: ontopic-server
  pullPolicy: IfNotPresent
  # Overrides the image tag whose default is the chart appVersion.
  tag: "helm-v2026.1.0"

#imagePullSecrets: [{ "name": "regcred" }]
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  # Specifies whether a service account should be created
  create: true
  # Annotations to add to the service account
  annotations: {}
  # The name of the service account to use.
  # If not set and create is true, a name is generated using the fullname template
  name: ""

podAnnotations: {}

podSecurityContext:
  fsGroup: 1000

securityContext: {}
  # capabilities:
  #   drop:
  #   - ALL
  # readOnlyRootFilesystem: true
  # runAsNonRoot: true
  # runAsUser: 1000

service:
  ## @param service.type Kubernetes Service type for HTTP API
  type: ClusterIP
  ## @param service.port HTTP API port
  port: 8080
  annotations: {}

## Separate service for PostgreSQL wire protocol
## Useful when HTTP needs to go through an ingress/gateway while PostgreSQL needs direct access
postgresService:
  ## @param postgresService.enabled Create a separate service for PostgreSQL port
  enabled: true 
  ## @param postgresService.type Kubernetes Service type for PostgreSQL
  type: LoadBalancer
  ## @param postgresService.port PostgreSQL wire protocol port
  port: 4300
  ## @param postgresService.annotations Annotations for the PostgreSQL service
  annotations: {}
  ## @param postgresService.loadBalancerIP Fixed LoadBalancer IP (optional)
  # loadBalancerIP: ""
  ## @param postgresService.loadBalancerSourceRanges Restrict LoadBalancer access to specific IPs
  # loadBalancerSourceRanges:
  #   - 10.0.0.0/8
  ## @param postgresService.externalTrafficPolicy Traffic policy (Local preserves client IP)
  # externalTrafficPolicy: Cluster
  ## @param postgresService.nodePort NodePort when using NodePort type
  # nodePort: 30430

ingress:
  enabled: false
  className: ""
  annotations: {}
    # kubernetes.io/ingress.class: nginx
    # kubernetes.io/tls-acme: "true"
  hosts:
    - host: ontopic.test
      paths:
        - path: /
          pathType: ImplementationSpecific
  tls: []
  #  - secretName: chart-example-tls
  #    hosts:
  #      - chart-example.local

livenessProbe:
  httpGet:
    path: /healthcheck
    port: http
  initialDelaySeconds: 75
  periodSeconds: 5

readinessProbe:
  httpGet:
    path: /healthcheck
    port: http
  initialDelaySeconds: 75
  periodSeconds: 5

resources: {}
  # We usually recommend not to specify default resources and to leave this as a conscious
  # choice for the user. This also increases chances charts run on environments with little
  # resources, such as Minikube. If you do want to specify resources, uncomment the following
  # lines, adjust them as necessary, and remove the curly braces after 'resources:'.
  # limits:
  #   cpu: 100m
  #   memory: 128Mi
  # requests:
  #   cpu: 100m
  #   memory: 128Mi

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 100
  targetCPUUtilizationPercentage: 80
  # targetMemoryUtilizationPercentage: 80

nodeSelector: {}

tolerations: []

affinity: {}

envConfigMapName: ontopic-server-config

env:
  ONTOPIC_SERVER_CORS_ALLOWED_ORIGINS: "*"
  ONTOPIC_SERVER_ENABLE_MATERIALIZATION: false
  ONTOPIC_SERVER_S3_ACCESS_KEY_ID_FILE: /run/secrets/s3-access-key-id/s3-access-key-id
  ONTOPIC_SERVER_S3_ACCESS_KEY_SECRET_FILE: /run/secrets/s3-access-key-secret/s3-access-key-secret
  ONTOPIC_SERVER_S3_BUCKET:
  ONTOPIC_SERVER_S3_REGION: eu-central-1
  ONTOPIC_SERVER_AZURE_ACCOUNT_NAME: /run/secrets/azure-account-name/azure-account-name
  ONTOPIC_SERVER_AZURE_ACCOUNT_KEY: /run/secrets/azure-account-key/azure-account-key
  ONTOPIC_SERVER_AZURE_SAS_TOKEN: /run/secrets/azure-sas-token/azure-sas-token
  ONTOPIC_SERVER_AZURE_CONTAINER_NAME:
  ONTOPIC_SERVER_MATERIALIZATION_CONFIGURATION_DIR: materialization-configuration
  ONTOPIC_SERVER_MATERIALIZATION_RESULT_DIR: materialization-result
  ONTOPIC_SERVER_LOG_LEVEL: INFO
  ONTOPIC_SERVER_ENABLE_POSTGRES_WIRE_PROTOCOL: true
  ONTOPIC_SERVER_LICENSE_FILE: /run/secrets/user-license/user-license
  ONTOPIC_SERVER_JDBC_ROOT_DIR: /opt/ontopic-server/jdbc
  ONTOPIC_SERVER_WEB_API_PORT: 8080
  ONTOPIC_SERVER_POSTGRES_PORT: 4300
  # ONTOPIC_SERVER_IDENTITY_SERVICE_URL: http://ontopic-suite-web:8080/
  ONTOPIC_SERVER_DISABLE_TLS: false

secrets:
  common:
    user-license-file:
      path: /run/secrets/user-license
      optional: false
  s3:
    s3-access-key-id:
      path: /run/secrets/s3-access-key-id
      optional: false
    s3-access-key-secret:
      path: /run/secrets/s3-access-key-secret
      optional: false
  azure:
    azure-account-name:
      path: /run/secrets/azure-account-name
      optional: false
    azure-account-key:
      path: /run/secrets/azure-account-key
      optional: true
    azure-sas-token:
      path: /run/secrets/azure-sas-token
      optional: true   # Either account-key OR sas-token required

storageProvider: # Options: s3, azure

persistentVolumeClaimRetentionPolicy:
  ## @param persistentVolumeClaimRetentionPolicy.enabled Enable Persistent volume retention policy for Deployment
  ##
  enabled: false
  ## @param persistentVolumeClaimRetentionPolicy.whenScaled Volume retention behavior when the replica count of the Deployment is reduced
  ##
  whenScaled: Retain
  ## @param persistentVolumeClaimRetentionPolicy.whenDeleted Volume retention behavior that applies when the Deployment is deleted
  ##
  whenDeleted: Retain

endpoint:
  persistence:
    ## @param endpoint.persistence.enabled Enable Ontopic endpoint data persistence using PVC
    ##
    enabled: true
    ## @param endpoint.persistence.volumeName Name to assign the volume
    ##
    volumeName: "endpoint-dir"
    ## @param endpoint.persistence.existingClaim Name of an existing PVC to use
    ##
    existingClaim: ""
    ## @param endpoint.persistence.mountPath The path the volume will be mounted at
    ##
    mountPath: /opt/ontopic-server/endpoint
    ## @param endpoint.persistence.subPath The subdirectory of the volume to mount to
    ## Useful in dev environments and one PV for multiple services
    ##
    subPath: ""
    ## @param endpoint.persistence.storageClass PVC Storage Class for Ontopic endpoint data volume
    ## If defined, storageClassName: <storageClass>
    ## If set to "-", storageClassName: "", which disables dynamic provisioning
    ## If undefined (the default) or set to null, no storageClassName spec is
    ##   set, choosing the default provisioner.  (gp2 on AWS, standard on
    ##   GKE, AWS & OpenStack)
    ##
    storageClass: ""
    ## @param endpoint.persistence.accessModes PVC Access Mode for Ontopic volume
    ##
    accessModes:
      - ReadWriteOnce
    ## @param endpoint.persistence.size PVC Storage Request for Ontopic volume
    ##
    size: 8Gi
    ## @param endpoint.persistence.annotations Annotations for the PVC
    ##
    annotations: {}
    ## @param endpoint.persistence.labels Labels for the PVC
    ##
    labels: {}
    ## @param endpoint.persistence.selector Selector to match an existing Persistent Volume (this value is evaluated as a template)
    ## selector:
    ##   matchLabels:
    ##     app: my-app
    ##
    selector: {}
    ## @param endpoint.persistence.dataSource Custom PVC data source
    ##
    dataSource: {}

endpointSecurity:
  persistence:
    ## @param endpointSecurity.persistence.enabled Enable Ontopic endpoint-security data persistence using PVC
    ##
    enabled: true
    ## @param endpointSecurity.persistence.volumeName Name to assign the volume
