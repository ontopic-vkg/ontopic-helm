apiVersion: v1
kind: Pod
metadata:
  name: "{{ include "ontopic-server.fullname" . }}-test-connection"
  labels:
    {{- include "ontopic-server.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": test
spec:
  containers:
    - name: wget
      image: alpine
      imagePullPolicy: {{ .Values.image.pullPolicy | default .Values.global.imagePullPolicy | default "IfNotPresent" }}
      command: ['wget']
      args: ['{{ include "ontopic-server.fullname" . }}:{{ .Values.service.port }}']
  restartPolicy: Never
